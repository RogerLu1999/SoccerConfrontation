<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEON STRIKE · 3V3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Neon Strike 首页"><span class="brand-mark">N</span><span>NEON <b>STRIKE</b></span></a>
        <div class="mode"><span class="live-dot"></span> 团队死斗 <em>3 V 3</em></div>
        <button id="soundBtn" class="icon-button" type="button" aria-label="切换声音">♪</button>
      </header>

      <section class="scorebar" aria-label="比赛状态">
        <div class="team team-blue"><span>◈</span><div><small>蓝队</small><strong id="blueScore">0</strong></div></div>
        <div class="match-info"><span id="timer">03:00</span><small>率先获得 20 击杀</small></div>
        <div class="team team-red"><div><small>红队</small><strong id="redScore">0</strong></div><span>◆</span></div>
      </section>

      <section class="game-wrap">
        <canvas id="game" width="1280" height="720" aria-label="俯视角 2D 团队枪战游戏"></canvas>

        <div class="hud-left panel-glass">
          <span class="avatar">01</span>
          <div><small>你 · 突击手</small><div class="health-track"><i id="healthBar"></i></div><strong id="healthText">100</strong><span> HP</span></div>
        </div>
        <div class="hud-right panel-glass"><small>弹药</small><strong id="ammo">12</strong><span>/ ∞</span><button id="reloadBtn" type="button">R 换弹</button></div>
        <div id="feed" class="kill-feed" aria-live="polite"></div>
        <div id="message" class="center-message"></div>

        <div id="startScreen" class="overlay">
          <div class="briefing">
            <p class="eyebrow">READY FOR DEPLOYMENT</p>
            <h1>霓虹突击 <span>3V3</span></h1>
            <p>与你的两名 AI 队友并肩作战，对抗三名红队特工。</p>
            <div class="controls-grid">
              <div><kbd>WASD</kbd><span>移动</span></div><div><kbd>鼠标</kbd><span>瞄准</span></div>
              <div><kbd>左键</kbd><span>射击</span></div><div><kbd>R</kbd><span>换弹</span></div>
            </div>
            <button id="startBtn" class="primary" type="button">开始行动 <span>→</span></button>
          </div>
        </div>

        <div class="mobile-controls" aria-hidden="true">
          <div id="joystick" class="joystick"><i></i></div>
          <button id="fireBtn" class="fire" type="button">开火</button>
        </div>
      </section>
      <footer><span>WASD 移动 · 鼠标瞄准 · 左键射击 · R 换弹</span><span>NEON ARENA // SECTOR 07</span></footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
